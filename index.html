<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Identity -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0B3B2E" />

    <!-- Primary SEO -->
    <title>MetaView — AI-Powered URL Previews, On Brand</title>
    <meta name="description" content="MetaView writes the metadata your pages are missing — starting with the share image. Connect a domain and every link you post arrives with a title, description, and a generated og:image that matches your brand." />
    <link rel="canonical" href="https://mymetaview.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="MetaView" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MetaView" />
    <meta property="og:url" content="https://mymetaview.com/" />
    <meta property="og:title" content="MetaView — AI-Powered URL Previews, On Brand" />
    <meta property="og:description" content="Point MetaView at a domain and every link you share arrives with a title, description, and a generated image that looks like you made it on purpose." />
    <meta property="og:image" content="https://mymetaview.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MetaView — Your links deserve a better first impression." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MetaView — AI-Powered URL Previews, On Brand" />
    <meta name="twitter:description" content="Point MetaView at a domain and every link you share arrives with a title, description, and a generated image that looks like you made it on purpose." />
    <meta name="twitter:image" content="https://mymetaview.com/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://mymetaview.com/#organization",
          "name": "MetaView",
          "url": "https://mymetaview.com/",
          "logo": "https://mymetaview.com/og-image.png",
          "description": "AI-powered URL previews that keep every link you share on brand."
        },
        {
          "@type": "WebSite",
          "@id": "https://mymetaview.com/#website",
          "url": "https://mymetaview.com/",
          "name": "MetaView",
          "publisher": { "@id": "https://mymetaview.com/#organization" }
        },
        {
          "@type": "SoftwareApplication",
          "name": "MetaView",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "url": "https://mymetaview.com/",
          "description": "MetaView reads your site once, learns its brand, and keeps every URL covered with generated titles, descriptions, and share images.",
          "offers": {
            "@type": "AggregateOffer",
            "lowPrice": "19",
            "highPrice": "149",
            "priceCurrency": "USD",
            "offerCount": "3"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
