name: Preview Corpus

# The corpus is the contract for "is the preview engine working?", and the
# nightly run is what turns it into a trend line rather than a vibe. Two modes:
#
#   nightly       whole corpus, scores the cards, records a trend point, and
#                 promotes the run to the baseline when it did not regress
#   pull_request  a capped slice, gated — a PR that makes the cards worse fails
#                 before a human reads it
#
# Both score the rendered PNGs, not the result dicts. A run where every card
# ships an unreadable headline used to pass every check here.

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC nightly
  pull_request:
    paths:
      - "backend/services/preview/**"
      - "backend/services/preview_engine.py"
      - "backend/services/premium_card_renderer.py"
      - "backend/services/preview_reasoning.py"
      - "backend/services/brand_extractor.py"
      - "backend/prompts/**"
  workflow_dispatch:
    inputs:
      include_shadow:
        description: "Include shadow corpus rotation"
        required: false
        default: "false"
      max_urls:
        description: "Cap number of URLs (0 = all)"
        required: false
        default: "0"

jobs:
  # Fast, hermetic, and the gate that actually blocks most PRs: the engine's own
  # tests plus the pixel metrics, neither of which touches the network.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
          pip install pytest
      - name: Engine tests
        run: pytest -q backend/tests

  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Live URLs and a model key. A fork PR has neither, and failing it for that
    # would be noise rather than signal.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      PYTHONPATH: ${{ github.workspace }}
      LOG_LEVEL: INFO
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
          pip install pytest
          playwright install --with-deps chromium

      # The baseline lives in the cache rather than the repo: it is a
      # measurement, not source, and committing one per night would be noise in
      # every diff.
      - name: Restore corpus baseline
        uses: actions/cache/restore@v4
        with:
          path: |
            artifacts/corpus-baseline.json
            artifacts/corpus-trend.jsonl
          key: corpus-baseline-${{ github.ref_name }}
          restore-keys: |
            corpus-baseline-main
            corpus-baseline-

      - name: Run and score the corpus
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # A PR gets a slice: enough URLs for the gate to mean something,
            # few enough that it does not add twenty minutes to every review.
            ARGS="--max-urls 12 --gate"
          else
            ARGS="--update-baseline"
            if [ "${{ github.event.inputs.include_shadow }}" = "true" ]; then
              ARGS="$ARGS --include-shadow"
            fi
            if [ -n "${{ github.event.inputs.max_urls }}" ] && [ "${{ github.event.inputs.max_urls }}" != "0" ]; then
              ARGS="$ARGS --max-urls ${{ github.event.inputs.max_urls }}"
            fi
          fi
          python -m backend.scripts.preview_engine.run_corpus \
              --output-dir artifacts/run \
              --quality-mode balanced \
              --workers 2 \
              $ARGS

      - name: Absolute quality floors
        run: |
          python - <<'PY'
          import glob, json, sys

          scores = sorted(glob.glob("artifacts/run/*/SCORES.json"))
          summaries = sorted(glob.glob("artifacts/run/*/SUMMARY.json"))
          if not scores or not summaries:
              print("Corpus produced no scores — it did not run", file=sys.stderr)
              sys.exit(1)

          visual = json.load(open(scores[-1]))
          summary = json.load(open(summaries[-1]))

          # The comparison gate catches regressions relative to the baseline.
          # These are the floors that hold regardless of what the baseline says,
          # so a slow drift can never end up somewhere unacceptable.
          checks = {
              "success_rate >= 0.95": summary.get("success_rate", 0) >= 0.95,
              "title_fidelity >= 0.70": summary.get("title_fidelity", 0) >= 0.70,
              "mean visual score >= 0.60": visual.get("mean_overall", 0) >= 0.60,
              "mean title contrast >= 3.0:1": visual.get("mean_title_contrast", 0) >= 3.0,
              "no gradient-only cards": visual.get("gradient_only_count", 1) == 0,
              "card pass rate >= 0.80": visual.get("pass_rate", 0) >= 0.80,
          }
          for label, ok in checks.items():
              print(f"{'PASS' if ok else 'FAIL'}  {label}")
          if not all(checks.values()):
              sys.exit(1)
          PY

      - name: Save corpus baseline
        if: github.event_name != 'pull_request' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            artifacts/corpus-baseline.json
            artifacts/corpus-trend.jsonl
          key: corpus-baseline-${{ github.ref_name }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-run-${{ github.run_id }}
          path: artifacts/run
          retention-days: 30
